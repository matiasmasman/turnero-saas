<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu Turno - Men's Club</title>
    <link rel="stylesheet" href="css/main.css?v=5">
    <link rel="apple-touch-icon" href="icono.png?v=1">
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="logo.jpg" alt="Men's Club Barberstudio" class="logo-img">
            </div>
        </div>

        <div class="card">
            <h2>Reservá tu turno</h2>

            <form id="appointmentForm">
                <div class="form-group">
                    <label for="client_name">Nombre Completo</label>
                    <input type="text" id="client_name" placeholder="Juan Diaz" required>
                </div>

                <div class="form-group">
                    <label for="client_phone">Teléfono / WhatsApp</label>
                    <input type="tel" id="client_phone" placeholder="261 123-4567" maxlength="10" pattern="[0-9]{10}"
                        title="Debe tener exactamente 10 números" required>
                </div>

                <!-- Servicio, descuento, barbero y horario los arma js/index.js con createElement/textContent
                     (los nombres los escribe el dueño): acá no va ningún nombre ni onclick. -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="service">Servicio</label>
                        <span id="servicePrice" class="service-price" aria-live="polite"></span>
                    </div>
                    <div class="select-pair">
                        <select id="service" required disabled>
                            <option value="">Cargando servicios...</option>
                        </select>
                        <select id="discount" aria-label="Descuento" disabled>
                            <option value="">Sin descuentos</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="employee_id">Barbero</label>
                    <select id="employee_id">
                        <option value="">Cualquiera disponible</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="appointmentDate">Fecha</label>
                    <input type="date" id="appointmentDate" required>
                </div>

                <div class="form-group">
                    <label for="timeSelect">Horario</label>
                    <select id="timeSelect" required disabled>
                        <option value="">Primero elegí un servicio y una fecha</option>
                    </select>
                </div>

                <p id="formError" class="form-error" role="alert" hidden></p>

                <button type="submit">Confirmar Turno</button>
            </form>
        </div>

        <div class="footer">
            <a href="https://wa.me/5492616839354?text=Hola Matias!%20Vi%20el%20sistema%20de%20turnos%20de%20Men's%20Club%20y%20me%20gustaría%20hacerte%20una%20consulta."
                target="_blank" rel="noopener noreferrer" class="footer-wpp-link">
                ¿Necesitás este sistema o un desarrollo a medida? <span>Contactame</span>
            </a>
        </div>
    </div>

    <script src="js/index.js?v=10"></script>
</body>

</html>
